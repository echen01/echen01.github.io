<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Microphone recording integration check</title>
  <link rel="stylesheet" href="../style.css?v=playground-simple-2">
  <style>
    #test-results { white-space: pre-wrap; overflow-wrap: anywhere; font-size: .8rem; }
    .test-controls { margin-block: 2rem; padding: 1.2rem; border: 1px solid #ccc; }
  </style>
  <script type="module" src="./microphone-browser-test.js?v=restore-recording-1"></script>
</head>
<body>
  <main class="article">
    <h1>Recording integration check</h1>
    <p>This local check records a generated tone with the browser’s native recorder, then fits it through the actual page controls and SwiftF0. It never requests microphone access. Keep this tab visible while it runs.</p>
    <section class="test-controls">
      <button type="button" class="button button-primary" id="test-run" disabled>Run recording check</button>
      <p id="test-status" role="status">Loading the main page controls…</p>
      <pre id="test-results">{}</pre>
    </section>
    <div id="test-page"></div>
  </main>
</body>
</html>
